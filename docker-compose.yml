services:
  mongo:
    image: mongo:7.0
    container_name: storeflow_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME : ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD : ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE : ${MONGO_DB}
    volumes:
            - mongo_data:/data/db




  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: storeflow_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/storeflow?authSource=admin
    depends_on:
        - mongo



volumes:
  mongo_data:
    driver: local
  
  





          
      
